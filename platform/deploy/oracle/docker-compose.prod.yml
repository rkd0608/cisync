# Sauron Phase-1 production stack — Oracle Cloud Always-Free A1.Flex (arm64).
# Standalone (NOT an overlay of the dev file): build ON the box, no registry.
#
# WHY single-host direct DNS: v0.2 phase-1 posture; no cloudflared — public
# ingress is ONLY caddy on 80/443; every other service stays on sauron-net.
# WHY no init.sql: migrations auto-run at boot inside each service binary
# (SPEC §3, AWS deploy-kit row); schema-per-service makes order irrelevant.
#
# Usage (from this directory):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: sauron

x-go-healthcheck: &go-healthcheck
  # WHY bash /dev/tcp and not curl/wget: runtime images are debian:bookworm-slim
  # with no HTTP client (adding one would touch services/** Dockerfiles, outside
  # deploy ownership). /dev/tcp is a bash builtin ⇒ zero-dependency TCP liveness.
  # HTTP-level probes of GET /healthz run from caddy in RUNBOOK-oracle §9.
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$$PORT && exec 3>&-"]
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Prod tuning: shared_buffers=3GB inside a 6g ceiling leaves room for
    # per-conn work_mem spikes + wal; effective_cache_size hints the planner
    # that the HOST page cache (~14GB free of 24GB) backs repeated reads.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=14GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - wal_compression=on
    environment:
      POSTGRES_USER: sauron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: sauron
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [sauron-net] # NOT published: DB is internal-only in prod
    mem_limit: 6g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauron -d sauron"]
      interval: 10s
      timeout: 5s
      retries: 12

  ingest:
    build: ../../../services/ingest
    restart: unless-stopped
    environment:
      SAURON_INGEST_PG_DSN: postgres://sauron:${POSTGRES_PASSWORD}@postgres:5432/sauron?pool_max_conns=20&statement_timeout=15000
      SAURON_INGEST_WEBHOOK_SECRET: ${SAURON_INGEST_WEBHOOK_SECRET:?set in .env.prod}
      SAURON_INGEST_ADDR: ":8080"
      SAURON_INGEST_CTRL_URL: http://control-plane:8081
    networks: [sauron-net] # reached publicly ONLY via caddy /hooks/github*
    mem_limit: 2g
    cpus: 0.5
    healthcheck: { <<: *go-healthcheck }
    depends_on:
      postgres: { condition: service_healthy }

  control-plane:
    build: ../../../services/control-plane
    restart: unless-stopped
    environment:
      SAURON_CTRL_PG_DSN: postgres://sauron:${POSTGRES_PASSWORD}@postgres:5432/sauron?pool_max_conns=64&statement_timeout=15000
      SAURON_CTRL_ADDR: ":8081"
      SAURON_CTRL_FLEET_URL: http://runner-fleet:8082
      SAURON_CTRL_LEDGER_KEY_FILE: /keys/ledger_ed25519.key
      # Dedicated job-lease signing key (B2/I-04): never the ledger key.
      SAURON_CTRL_JOBLEASE_KEY_FILE: /keys/joblease_ed25519.key
      SAURON_CTRL_ADMIN_TOKEN: ${SAURON_CTRL_ADMIN_TOKEN:?set in .env.prod}
      SAURON_CTRL_WEBHOOK_SECRET: ${SAURON_CTRL_WEBHOOK_SECRET:?must equal ingest secret}
      SAURON_CTRL_CONNECTOR_URL: http://github-connector:8083
      # I-07 nightly chain verify (H3): same verifier as `verify` subcommand.
      SAURON_CTRL_VERIFY_INTERVAL: ${SAURON_CTRL_VERIFY_INTERVAL:-24h}
      # B7 audit retention floor is 90d; we keep 180d on the big box.
      SAURON_CTRL_AUDIT_RETENTION_DAYS: ${SAURON_CTRL_AUDIT_RETENTION_DAYS:-180}
      SAURON_CTRL_TRACKED_BASE_BRANCHES: ${SAURON_CTRL_TRACKED_BASE_BRANCHES:-main,master}
      # NOTE: scheduler tick/reconcile/batch/rate-limit stay at CODE DEFAULTS
      # (1s/30s/8/120min) — dev compose overrides were harness-window sizing
      # only (SPEC §3 W3-closer). Prod posture = conservative defaults.
    volumes:
      - ./keys:/keys:ro
    networks: [sauron-net] # NEVER internet-exposed (D2)
    mem_limit: 4g
    cpus: 1.0
    healthcheck: { <<: *go-healthcheck }
    depends_on:
      postgres: { condition: service_healthy }

  runner-fleet:
    build: ../../../services/runner-fleet
    restart: unless-stopped
    environment:
      SAURON_FLEET_PG_DSN: postgres://sauron:${POSTGRES_PASSWORD}@postgres:5432/sauron?pool_max_conns=32&statement_timeout=15000
      SAURON_FLEET_ADDR: ":8082"
      # sim provider: docker provider stays NOT-FOR-PRODUCTION (B5) until
      # THREAT_MODEL graduation; also avoids socket-sharing on the prod host.
      SAURON_FLEET_PROVIDER: sim
      SAURON_FLEET_JOBLEASYPUB_KEY_FILE: /keys/joblease_ed25519.pub
    volumes:
      - ./keys:/keys:ro
    networks: [sauron-net]
    mem_limit: 2g
    cpus: 0.25
    healthcheck: { <<: *go-healthcheck }
    depends_on:
      postgres: { condition: service_healthy }

  github-connector:
    build: ../../../services/github-connector
    restart: unless-stopped
    environment:
      SAURON_CONN_PG_DSN: postgres://sauron:${POSTGRES_PASSWORD}@postgres:5432/sauron
      SAURON_CONN_ADDR: ":8083"
      SAURON_CONN_WEBHOOK_SECRET: ${SAURON_CONN_WEBHOOK_SECRET:?set in .env.prod}
      SAURON_CONN_ADMIN_TOKEN: ${SAURON_CONN_ADMIN_TOKEN:?set in .env.prod}
      SAURON_CONN_DETAILS_URL: https://${DOMAIN:?set in .env.prod}
      # Dry-run by default: uncomment ALL THREE GitHub App vars together to
      # go live (config.go refuses half-configured creds).
      # SAURON_CONN_GITHUB_APP_ID: "123456"
      # SAURON_CONN_GITHUB_PRIVATE_KEY_FILE: /keys/github-app.pem
      # SAURON_CONN_GITHUB_INSTALLATION_ID: "789012"
      # SAURON_CONN_CTRL_URL: http://control-plane:8081
      # SAURON_CONN_CTRL_TOKEN: ${SAURON_CTRL_ADMIN_TOKEN}
    volumes:
      - ./keys:/keys:ro
    networks: [sauron-net]
    mem_limit: 1g
    cpus: 0.25
    healthcheck: { <<: *go-healthcheck }
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ../../../apps/web
    restart: unless-stopped
    environment:
      # Server-side proxy upstream (/api/sauron/* route handler injects the
      # admin bearer server-side; tokens never reach the bundle).
      SAURON_API_URL: http://control-plane:8081
      SAURON_CONNECTOR_URL: http://github-connector:8083
      SAURON_ADMIN_TOKEN: ${SAURON_CTRL_ADMIN_TOKEN}
    networks: [sauron-net]
    mem_limit: 2g
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      control-plane: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80" # ONLY public ingress; ACME http-01 needs it too
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [sauron-net]
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ingest: { condition: service_started }
      web: { condition: service_started }

networks:
  sauron-net:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Resource budget check (24GB box): 6+4+2+2+1+0.5 = 15.5g ceilings ≪ 20g cap;
# ~8.5g headroom stays for PG page cache + arm-native builds at upgrade time.
