name: cisync

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: cisync
      POSTGRES_PASSWORD: cisync_dev_only
      POSTGRES_DB: cisync
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cisync -d cisync"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingest:
    build: ../services/ingest
    environment:
      CISYNC_INGEST_PG_DSN: postgres://cisync:cisync_dev_only@postgres:5432/cisync?pool_max_conns=20&statement_timeout=15000
      CISYNC_INGEST_WEBHOOK_SECRET: ${CISYNC_INGEST_WEBHOOK_SECRET:-dev_webhook_secret_not_for_prod}
      CISYNC_INGEST_ADDR: ":8080"
      CISYNC_INGEST_CTRL_URL: http://control-plane:8081
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  control-plane:
    build: ../services/control-plane
    environment:
      CISYNC_CTRL_PG_DSN: postgres://cisync:cisync_dev_only@postgres:5432/cisync?pool_max_conns=64&statement_timeout=15000
      # WHY 20 conns: scheduler tick, outbox relay and API bursts share one
      # pool; the pgx default (4×CPU) starves intent-creation bursts.
      CISYNC_CTRL_ADDR: ":8081"
      CISYNC_CTRL_FLEET_URL: http://runner-fleet:8082
      CISYNC_CTRL_LEDGER_KEY_FILE: /keys/ledger_ed25519.dev.key
      # DEDICATED job-lease signing key (B2/I-04): never the ledger key.
      CISYNC_CTRL_JOBLEASE_KEY_FILE: /keys/joblease_ed25519.dev.key
      CISYNC_CTRL_ADMIN_TOKEN: dev_admin_token_not_for_prod
      CISYNC_CTRL_CONNECTOR_URL: http://github-connector:8083
      CISYNC_CTRL_WEBHOOK_SECRET: ${CISYNC_INGEST_WEBHOOK_SECRET:-dev_webhook_secret_not_for_prod}
      # WHY 600: one suite run issues ~40 intent creations inside ~30s; the
      # 120/min default bucket drains across back-to-back runs and 429s them.
      # Typed rate_limited refusals themselves stay contract-conformant.
      CISYNC_CTRL_RATE_LIMIT_PER_MIN: "600"
      # WHY 24: batch bounds per-tick dispatch; 8 starved suite fan-out
      # (17 runs per candidate) behind multi-suite concurrency.
      CISYNC_CTRL_SCHED_BATCH: "24"
      # WHY 200ms: e2e/invariant suites fan out ~16 sim runs per candidate;
      # the 1s default tick made decision latency exceed the 30s harness
      # windows under full-suite load (W3 close-out, SPEC §3).
      CISYNC_CTRL_TICK_INTERVAL: "200ms"
      # WHY 5s+300s: a fleet restart orphans ctrl-side dispatched runs and
      # the reconciler must reclaim them, BUT a run may legitimately sit
      # dispatched while the fleet works through a burst backlog — killing
      # it there strands its candidate (a required kind can never complete).
      CISYNC_CTRL_RECONCILE_INTERVAL: "5s"
      CISYNC_CTRL_STALE_RUN_MAX_AGE: "300s"
    volumes:
      - ./dev-keys:/keys:ro
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  runner-fleet:
    build: ../services/runner-fleet
    environment:
      CISYNC_FLEET_PG_DSN: postgres://cisync:cisync_dev_only@postgres:5432/cisync?pool_max_conns=32&statement_timeout=15000
      CISYNC_FLEET_ADDR: ":8082"
      CISYNC_FLEET_PROVIDER: sim
      # Job-lease verification public half (B2/I-04): mutating endpoints
      # 401 without a valid control-plane-signed lease token.
      CISYNC_FLEET_JOBLEASYPUB_KEY_FILE: /keys/joblease_ed25519.dev.pub
      # WHY 48: matches multi-suite fan-out so queued runs drain faster than
      # the harness decision windows; sim jobs are trivial, dev posture only.
      CISYNC_FLEET_SIM_WORKERS: "48"
    volumes:
      - ./dev-keys:/keys:ro
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }

  # github-connector runs dry-run by default: without GitHub App credentials
  # it logs the would-be check payloads instead of calling the Checks API.
  github-connector:
    build: ../services/github-connector
    environment:
      CISYNC_CONN_PG_DSN: postgres://cisync:cisync_dev_only@postgres:5432/cisync
      CISYNC_CONN_ADDR: ":8083"
      CISYNC_CONN_WEBHOOK_SECRET: dev_webhook_secret_not_for_prod
      # GET /v1/installations/status bearer; unset ⇒ route fails closed 401.
      CISYNC_CONN_ADMIN_TOKEN: dev_admin_token_not_for_prod
      # Optional GitHub App cred trio for live mode (G14): uncomment ALL
      # THREE together after `scripts/github-app-manifest.sh` or the manual
      # runbook emits them into .env.local. Half-configured creds refuse to
      # boot (all-or-nothing, config.go).
      CISYNC_CONN_GITHUB_APP_ID: ${CISYNC_CONN_GITHUB_APP_ID:-}
      CISYNC_CONN_GITHUB_PRIVATE_KEY_FILE: ${CISYNC_CONN_GITHUB_PRIVATE_KEY_FILE:-/keys/github-app.dev.pem}
      CISYNC_CONN_GITHUB_INSTALLATION_ID: ${CISYNC_CONN_GITHUB_INSTALLATION_ID:-}
      CISYNC_CONN_DETAILS_URL: http://localhost:3000
      # Control-plane endpoint + bearer for rerun replan (plan §4.5):
      CISYNC_CONN_CTRL_URL: http://control-plane:8081
      CISYNC_CONN_CTRL_TOKEN: ${CISYNC_ADMIN_TOKEN:-dev_admin_token_not_for_prod}
    volumes:
      - ./dev-keys:/keys:ro
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }

  # --profile github: zero-account public webhook loopback for real GitHub
  # Apps in local dev (plan §5.3/§5.4). Quick tunnels print the generated
  # https://*.trycloudflare.com URL to container logs at boot — point the
  # App's webhook at <that-url>/hooks/github. Only ingest is exposed; ctrl
  # and connector stay internal. `ngrok http 8080` documented as alternative.
  webhook-forwarder:
    image: cloudflare/cloudflared:latest
    profiles: ["github"]
    command: tunnel --no-autoupdate --url http://ingest:8080
    depends_on:
      - ingest

  web:
    build: ../apps/web
    environment:
      # Server-side proxy upstream (next.config.ts rewrites /api/cisync/*).
      CISYNC_API_URL: http://control-plane:8081
      CISYNC_CONNECTOR_URL: http://github-connector:8083
      CISYNC_ADMIN_TOKEN: dev_admin_token_not_for_prod
    ports: ["3000:3000"]
    depends_on: [control-plane]

volumes:
  pgdata:
